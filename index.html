  <style>
    /* Layout and styling */
    body { margin: 0; font-family: Arial, sans-serif; height: 100vh; display: flex; }
    .container { display: flex; flex: 1; }
    .sidebar { width: 220px; background: #333; color: #fff; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; }
    .sidebar h2 { margin-top: 0; }
    .sidebar ul { list-style: none; padding: 0; margin: 0; flex-grow: 1; overflow-y: auto; }
    .sidebar li { padding: 5px 8px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sidebar li.active { background: #555; }
    .main-content { flex: 1; display: flex; flex-direction: column; }
    .toolbar { padding: 5px; background: #222; color: #fff; display: flex; justify-content: flex-end; }
    iframe { flex: 1; border: none; width: 100%; }
    #searchBar { width: 100%; padding: 5px; margin-bottom: 10px; box-sizing: border-box; border: 1px solid #555; background: #444; color: #fff; }
    #loading { color: #aaa; text-align: center; padding: 20px 0; font-size: 0.9em; }
  </style>
</head>
<body>

      <h2>Game List</h2>
      <input type="text" id="searchBar" placeholder="Search games..." />
      <div id="loading">Loading games...</div>
      <ul id="gameList">
        </ul>
    </aside>
    <main class="main-content">
      <div class="toolbar">
        <button id="fullscreenBtn">Fullscreen</button>

      <iframe id="gameFrame" src=""></iframe>

  </div>

      { friendlyName: 'Ragdoll Soccer', fileName: 'clragdollsoccer.html' },
      { friendlyName: 'Ragdol Hit', fileName: 'clragdollhit.html' },
      { friendlyName: 'Race master 3d', fileName: 'clracemaster3d.html' },
      { friendlyName: 'Slow roads io', fileName: 'clslowroads.html' },
      { friendlyName: 'Vex 6', fileName: 'clvex6.html' },
      { friendlyName: 'Vex x3m', fileName: 'clvexx3m.html' },
      { friendlyName: 'Wheelie bike', fileName: 'clwheeliebike.html' }
    ];

    // --- DOM Elements & Variables ---
    const gameList = document.getElementById('gameList');
    const gameFrame = document.getElementById('gameFrame');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const searchBar = document.getElementById('searchBar');
    const loadingMessage = document.getElementById('loading');
    let allGames = [];

    function focusIframe() {
      setTimeout(() => gameFrame.focus(), 50);
    }

    /**
     * Creates a user-friendly name from a GitHub filename, cleaning up prefixes and adding spaces.
     * @param {string} fileName The file name (e.g., 'cldriftboss.html').
     * @returns {string} The cleaned, capitalized name (e.g., 'Drift Boss').
     */
    function getFriendlyName(fileName) {
        // 1. Remove file extension (.html or .htm)
        let name = fileName.replace(/\.(html|htm)$/i, '');
        
        // 2. Remove common prefixes (case-insensitive)
        const prefixesToRemove = /^(cl|cl|cld|cldrift|clboss)/i;
        name = name.replace(prefixesToRemove, '');

        // 3. Insert a space before any capital letter that follows a lowercase letter (CamelCase fix)
        name = name.replace(/([a-z])([A-Z])/g, '$1 $2');
        
        // 4. Replace hyphens (-) and underscores (_) with spaces
        name = name.replace(/[-_]/g, ' ');
        
        // 5. Capitalize the first letter of every word
        name = name.replace(/\b\w/g, l => l.toUpperCase());

        // 6. Trim leading/trailing whitespace and reduce multiple spaces to a single space
        return name.trim().replace(/\s{2,}/g, ' ');
    }

    // --- Game List Fetching and Merging ---
    async function fetchAndMergeGameList() {
      loadingMessage.style.display = 'block';
      const API_URL = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/`;
      const manualFileNames = MANUAL_GAMES.map(g => g.fileName);
      
      let fetchedGames = [];

      try {
        const response = await fetch(API_URL);
        if (!response.ok) {
          throw new Error(`GitHub API error: ${response.statusText}`);
        }
        const data = await response.json();

        // 1. Filter and process fetched files
        fetchedGames = data
          .filter(item => 
            item.type === 'file' && 
            (item.name.toLowerCase().endsWith('.html') || item.name.toLowerCase().endsWith('.htm')) &&
            !manualFileNames.includes(item.name) && // Exclude files already in the manual list
            item.name.toLowerCase() !== 'index.html' // Exclude index.html itself
          )
          .map(item => {
            const fileName = item.name;
            return {
              fileName: fileName,
              friendlyName: getFriendlyName(fileName),
              gameUrl: `${BASE_URL}/${fileName}`
            };
          });

      } catch (error) {
        console.warn('Could not fetch new games via GitHub API. Using manual list only.', error);
      }

      // 2. Process Manual Games
      const processedManualGames = MANUAL_GAMES.map(game => {
          let url = `${BASE_URL}/${game.fileName}`;
          return {
              ...game,
              gameUrl: url
          };
      });

      // 3. Combine the lists (Manual list first for priority/order)
      allGames = processedManualGames.concat(fetchedGames);

      renderGameList(allGames);
      loadDefaultGame(allGames);
      loadingMessage.style.display = 'none';
    }

    // --- Game List Rendering ---
    function renderGameList(games) {
      gameList.innerHTML = '';
      if (games.length === 0) {
        gameList.innerHTML = '<li>No games found.</li>';
        return;
      }

      games.forEach(game => {
        const li = document.createElement('li');
        li.textContent = game.friendlyName;
        li.dataset.gameUrl = game.gameUrl;
        gameList.appendChild(li);
      });
    }

    // --- Load Default Game ---
    function loadDefaultGame(games) {
        const defaultGame = games.find(g => g.friendlyName === 'Homepage');
        
        if (defaultGame) {
            gameFrame.src = defaultGame.gameUrl;
            const defaultLi = gameList.querySelector(`li[data-game-url="${defaultGame.gameUrl}"]`);
            if (defaultLi) {
                defaultLi.classList.add('active');
            }
        }
    }

    // --- Search Functionality ---
    searchBar.addEventListener('input', function() {
      const searchTerm = searchBar.value.toLowerCase();
      const filteredGames = allGames.filter(game => 
        game.friendlyName.toLowerCase().includes(searchTerm)
      );
      renderGameList(filteredGames);
    });

    // --- Game Click Handler ---
    gameList.addEventListener('click', function(e) {
      const li = e.target.closest('li[data-game-url]');
      if (!li) return;

      gameList.querySelectorAll('li').forEach(item => item.classList.remove('active'));
      li.classList.add('active');

      gameFrame.src = li.dataset.gameUrl;

      gameFrame.addEventListener('load', () => focusIframe(), { once: true });
    });

    // --- Fullscreen and Focus Handlers ---
    gameFrame.addEventListener('click', focusIframe);
    fullscreenBtn.addEventListener('click', () => {
      if (gameFrame.requestFullscreen) gameFrame.requestFullscreen();
      else if (gameFrame.webkitRequestFullscreen) gameFrame.webkitRequestFullscreen();
      else if (gameFrame.msRequestFullscreen) gameFrame.msRequestFullscreen();
      focusIframe();
    });
    
    // --- Initial Load ---
    fetchAndMergeGameList();
  </script>
</body>
</html>
